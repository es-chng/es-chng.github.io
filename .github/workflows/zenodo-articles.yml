name: Deposit article PDFs to Zenodo

# Runs after a successful Pages build, or on demand.
# DOIs are written only to _data/zenodo-ledger.yml (never into article
# front matter). Ledger commits use [skip ci] so Pages does not re-run
# solely because the ledger was updated.
#
# DOI flow (scripts/zenodo_articles.py):
#   1. Prereserve DOI on Zenodo
#   2. Render PDF with that DOI in the footer
#   3. Upload PDF and publish
#   4. Update _data/zenodo-ledger.yml
on:
  workflow_run:
    workflows: ["Validate, build and publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      live:
        description: "Deposit to production zenodo.org (default is sandbox)"
        required: false
        type: boolean
        default: false
      force:
        description: "Re-deposit even when content is unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: zenodo-articles
  cancel-in-progress: false

jobs:
  deposit:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Commit Pages built (workflow_run) or current SHA (manual run)
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install fonts used by the PDF renderer
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu

      - name: Restore the PDF cache
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: pdf-cache-zenodo-${{ github.run_id }}
          restore-keys: |
            pdf-cache-

      - name: Deposit to Zenodo (reserve DOI → embed in PDF → upload → publish)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_LIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.live) && '1' || '' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://es-chng.github.io' }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ZENODO_TOKEN is not set — cannot deposit."
            exit 1
          fi
          mkdir -p .pdf-out
          EXTRA=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA="--force"
          fi
          python scripts/zenodo_articles.py .pdf-out $EXTRA
          mkdir -p .pdf-cache
          cp -f .pdf-out/*.pdf .pdf-cache/ 2>/dev/null || true

      - name: Commit ledger if it changed
        run: |
          set -e
          if [ ! -f _data/zenodo-ledger.yml ]; then
            echo "No ledger file."
            exit 0
          fi
          if git diff --quiet -- _data/zenodo-ledger.yml 2>/dev/null; then
            echo "Ledger unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"

          # Keep the ledger we just produced
          cp _data/zenodo-ledger.yml /tmp/zenodo-ledger.yml

          # Move to current remote branch tip (avoids non-fast-forward)
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/${BRANCH}"

          cp /tmp/zenodo-ledger.yml _data/zenodo-ledger.yml
          git add _data/zenodo-ledger.yml

          if git diff --staged --quiet; then
            echo "Ledger already up to date on remote."
            exit 0
          fi

          git commit -m "chore: update Zenodo DOI ledger [skip ci]"
          git push origin "HEAD:${BRANCH}"
