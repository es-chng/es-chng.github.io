name: Validate, build and publish

# PDFs are incremental only. Zenodo deposit is in zenodo-articles.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain

      - name: Validate every article against its schema
        run: python scripts/validate_schema.py

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: bundle install

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Restore the PDF cache from the previous run
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: |
            pdf-cache-

      - name: Build a PDF for every new or changed article
        run: |
          mkdir -p _site/files
          python scripts/render_changed_pdfs.py .pdf-cache _site/files

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
