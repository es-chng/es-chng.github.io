<style>
  :root {
    --bg: #FFFFFF;
    --ink: #22202C;
    --muted: #625F78;
    --rule: #E4E2EB;
    --accent: #3E2F74;

    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Source Sans 3", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;

    --fs-body: 1rem;
    --fs-small: 0.875rem;

    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17141F;
      --ink: #E9E6F2;
      --muted: #A29DB8;
      --rule: #332D45;
      --accent: #B7A8F0;
    }
  }

  :root[data-theme="dark"] {
    --bg: #17141F;
    --ink: #E9E6F2;
    --muted: #A29DB8;
    --rule: #332D45;
    --accent: #B7A8F0;
  }

  *, *::before, *::after {
    box-sizing: inherit;
  }

  html {
    scroll-padding-top: env(safe-area-inset-top, 0px);
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--serif);
    font-size: var(--fs-body);
    line-height: 1.56;
    -webkit-font-smoothing: antialiased;
  }

  a {
    color: var(--accent);
    text-decoration: none;
  }

  a:hover {
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    border-radius: 2px;
  }


  /* =========================
     PAGE WIDTH
     ========================= */

  .wrap {
    max-width: 1040px;
    margin: 0 auto;
    padding:
      1.65rem
      clamp(1.1rem, 3vw, 2rem)
      1.1rem;
  }


  /* =========================
     HEADER
     ========================= */

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 1rem 2rem;

    flex-wrap: wrap;

    padding-bottom: 0.65rem;

    border-bottom: 1.5px solid var(--accent);
  }

  .id {
    display: flex;
    align-items: center;
    gap: 0.9rem;
  }

  .photo {
    width: 72px;
    height: 72px;

    border-radius: 50%;

    object-fit: cover;

    border: 1.5px solid var(--rule);

    flex: none;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 600;

    font-size: 1.8rem;
    line-height: 1.08;

    margin: 0;

    letter-spacing: 0.005em;
  }

  .post {
    text-align: left;

    font-style: italic;

    font-size: var(--fs-body);

    color: var(--accent);

    margin: 0.18rem 0 0;

    line-height: 1.35;
  }

  .contact {
    text-align: right;

    font-family: var(--sans);

    font-size: var(--fs-small);

    color: var(--muted);

    line-height: 1.5;
  }

  @media (min-width: 641px) {
    header {
      flex-wrap: nowrap;
    }

    .id {
      min-width: 0;
    }

    .contact {
      flex: none;
    }
  }

  @media (max-width: 640px) {
    .contact {
      text-align: left;
    }
  }


  /* =========================
     BODY TEXT
     ========================= */

  p,
  .rows li > div {
    text-align: justify;
    hyphens: auto;
    -webkit-hyphens: auto;
  }

  @media (max-width: 480px) {
    p,
    .rows li > div {
      text-align: left;
    }
  }

  .lede {
    margin: 0.7rem 0 0;
    max-width: 1000px;
  }

  .pub {
    font-family: var(--sans);
    font-size: var(--fs-small);

    color: var(--muted);

    margin: 0.28rem 0 0;
  }

  .pub a {
    font-family: var(--serif);

    font-size: var(--fs-body);

    font-weight: 600;
  }


  /* =========================
     MAIN
     ========================= */

  main {
    margin-top: 0.65rem;

    border-top: 1px solid var(--rule);
  }

  section {
    display: grid;

    grid-template-columns:
      7.5rem
      minmax(0, 1fr);

    gap: 0.2rem 1.35rem;

    padding: 0.68rem 0;

    border-bottom: 1px solid var(--rule);
  }

  section:last-of-type {
    border-bottom: 0;
  }

  @media (max-width: 600px) {
    section {
      grid-template-columns: 1fr;
      gap: 0.3rem;
    }
  }

  h2 {
    font-family: var(--sans);

    font-weight: 600;

    font-size: var(--fs-small);

    letter-spacing: 0.01em;

    line-height: 1.35;

    color: var(--accent);

    margin: 0;

    padding-top: 0.1rem;
  }

  p {
    margin: 0 0 0.28rem;
  }

  p:last-child {
    margin-bottom: 0;
  }

  b {
    font-weight: 600;
  }


  /* =========================
     ROWS
     ========================= */

  .rows {
    list-style: none;

    margin: 0;
    padding: 0;
  }

  .rows li {
    display: grid;

    grid-template-columns:
      6rem
      minmax(0, 1fr);

    gap: 0.75rem;

    padding: 0.04rem 0;
  }

  .rows li + li {
    margin-top: 0.28rem;
  }

  .when,
  .label {
    font-family: var(--sans);

    color: var(--muted);

    font-size: var(--fs-small);

    font-variant-numeric: tabular-nums;

    padding-top: 0.1rem;
  }

  .label {
    color: var(--ink);

    font-weight: 600;
  }

  .org {
    color: var(--muted);
  }

  @media (max-width: 460px) {
    .rows li {
      grid-template-columns: 1fr;
      gap: 0;
    }

    .when,
    .label {
      padding-top: 0;
    }
  }


  /* =========================
     SUPPORTING TEXT
     ========================= */

  .muted {
    color: var(--muted);
  }

  .note {
    font-family: var(--sans);

    font-size: var(--fs-small);

    margin-top: 0.35rem;
  }

  .links {
    font-family: var(--sans);

    font-size: var(--fs-small);

    display: flex;

    flex-wrap: wrap;

    gap: 0.25rem 1.1rem;
  }


  /* =========================
     FOOTER
     ========================= */

  footer {
    margin-top: 0.55rem;

    padding-top: 0.55rem;

    border-top: 1px solid var(--rule);

    color: var(--muted);

    font-family: var(--sans);

    font-size: var(--fs-small);
  }


  /* =========================
     PRINT
     ========================= */

  @media print {

    :root {
      --fs-body: 10pt;
      --fs-small: 9pt;
    }

    .wrap {
      padding-top: 0;
      max-width: none;
    }

    a {
      color: inherit;
    }

    section {
      break-inside: avoid;
    }
  }
</style>
