title: Anatomic Pathology in Focus
tagline: A microjournal in anatomical pathology
description: >-
  Practical, evidence-aware discussions of focused diagnostic and reporting questions,
  particularly where published evidence meets everyday professional judgement.
url: "https://es-chng.github.io"
baseurl: ""   # this repo is the root user-pages site, so no subpath
collections:
  issues:
    output: true
    permalink: /issues/:name/
  articles:
    output: true
    permalink: /articles/:name/
defaults:
  - scope: { path: "", type: articles }
    values: { layout: article }
  - scope: { path: "", type: issues }
    values: { layout: issue }
exclude:
  - README.md
  - CHANGELOG.md
