name: Validate, build and publish

# Runs on every push to main. Validation is a hard gate: if any article fails,
# nothing below runs and the live site keeps the last good deploy.
#
# PDFs here are incremental (render_changed_pdfs). Zenodo deposit + DOI embed
# lives in zenodo-articles.yml (runs after this workflow succeeds). Do not
# call zenodo_articles.py here or you will double-deposit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skip pure ledger-only commits from the Zenodo workflow
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate every article against its schema
        run: python scripts/validate_schema.py

      - name: Install fonts used by the PDF renderer
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Jekyll
        run: bundle install

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Restore the PDF cache from the previous run
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: |
            pdf-cache-

      - name: Build a PDF for every new or changed article
        run: |
          mkdir -p _site/files
          python scripts/render_changed_pdfs.py .pdf-cache _site/files

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
