name: Deposit article PDFs to Zenodo

on:
  workflow_run:
    workflows: ["Validate, build and publish"]
    types: [completed]
  workflow_dispatch:
    inputs:
      live:
        description: "Deposit to production zenodo.org (default is sandbox)"
        required: false
        type: boolean
        default: false
      force:
        description: "Re-deposit even when content is unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: write   # to start a site rebuild once new DOIs are recorded

concurrency:
  group: zenodo-articles
  cancel-in-progress: false

jobs:
  deposit:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: ./.github/actions/setup-toolchain

      - name: Restore the PDF cache
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: pdf-cache-zenodo-${{ github.run_id }}
          restore-keys: |
            pdf-cache-

      - name: Deposit to Zenodo (reserve DOI → embed in PDF → upload → publish)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_LIVE: ${{ (github.event_name == 'workflow_dispatch' && inputs.live) && '1' || '' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://es-chng.github.io' }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "ZENODO_TOKEN is not set — cannot deposit."
            exit 1
          fi
          mkdir -p .pdf-out
          EXTRA=""
          if [ "${{ inputs.force }}" = "true" ]; then
            EXTRA="--force"
          fi
          python scripts/zenodo_articles.py .pdf-out $EXTRA
          mkdir -p .pdf-cache
          cp -f .pdf-out/*.pdf .pdf-cache/ 2>/dev/null || true

      - name: Commit ledger if it changed
        run: |
          if [ ! -f _data/zenodo-ledger.yml ]; then
            echo "No ledger file."
            exit 0
          fi
          if git diff --quiet -- _data/zenodo-ledger.yml 2>/dev/null; then
            echo "Ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/zenodo-ledger.yml
          git commit -m "chore: update Zenodo DOI ledger [skip ci]" || exit 0
          BRANCH="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          # The build may have committed a schema lock since this run started.
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"
          # The ledger commit is [skip ci], so start the site build explicitly:
          # it puts the new DOI on the article page and into the site PDF.
          gh workflow run pages.yml --ref "${BRANCH}"
        env:
          GH_TOKEN: ${{ github.token }}
