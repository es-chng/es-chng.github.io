name: Validate, build and publish

# Runs on every push to main. Validation runs first: if any article fails its
# schema's checks, the job stops there and nothing below it runs -- the site
# keeps serving whatever was last published successfully.
#
# PDF + DOI flow when ZENODO_TOKEN is set:
#   1. Prereserve DOI on Zenodo
#   2. Render PDF with that DOI in the footer
#   3. Upload PDF and publish the deposition
#   4. Write DOI to _data/zenodo-ledger.yml (committed with [skip ci])
# Without the token, PDFs still build locally via render_changed_pdfs.py
# (placeholder DOIs only).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Skip pure ledger-only commits from the previous run
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Validate every article against its schema
        run: python scripts/validate_schema.py

      - name: Install fonts used by the PDF renderer
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Jekyll
        run: bundle install

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Restore the PDF cache from the previous run
        uses: actions/cache@v4
        with:
          path: .pdf-cache
          key: pdf-cache-${{ github.run_id }}
          restore-keys: |
            pdf-cache-

      # PDFs: with ZENODO_TOKEN → reserve DOI, embed in PDF, upload, publish.
      # Without token → incremental local PDFs (placeholder DOI in footer only).
      - name: Build PDFs (and deposit to Zenodo when token is set)
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
          ZENODO_LIVE: ${{ vars.ZENODO_LIVE }}
          SITE_URL: ${{ vars.SITE_URL || 'https://es-chng.github.io' }}
        run: |
          mkdir -p _site/files .pdf-cache
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "No ZENODO_TOKEN — building PDFs without Zenodo deposit."
            python scripts/render_changed_pdfs.py .pdf-cache _site/files
          else
            echo "ZENODO_TOKEN present — reserve DOI → embed in PDF → upload → publish."
            python scripts/zenodo_articles.py _site/files
            cp -f _site/files/*.pdf .pdf-cache/ 2>/dev/null || true
          fi

      - name: Commit Zenodo ledger if updated
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: |
          if [ -z "$ZENODO_TOKEN" ]; then
            echo "No token; skip ledger commit."
            exit 0
          fi
          if [ ! -f _data/zenodo-ledger.yml ]; then
            echo "No ledger file."
            exit 0
          fi
          if git diff --quiet -- _data/zenodo-ledger.yml 2>/dev/null; then
            echo "Ledger unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/zenodo-ledger.yml
          git commit -m "chore: update Zenodo DOI ledger [skip ci]"
          git push

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
